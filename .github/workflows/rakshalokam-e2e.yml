name: Rakshalokam E-Commerce Test Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Google Chrome and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable

      - name: Install Playwright Browsers and System Dependencies
        run: |
          mvn test-compile exec:java -e -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Prepare CI config.properties
        run: |
          mkdir -p src/test/resources
          cat <<EOF > src/test/resources/config.properties
          baseUrl=https://rakshalokam.in
          browser=chrome
          headless=true
          explicitTimeout=20
          test.session.cookie=${{ secrets.RAKSHALOKAM_SESSION_COOKIE }}
          EOF

      - name: Run Test Suite with Virtual Display
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" mvn clean test \
            -DsuiteXmlFile=testng.xml \
            -Dheadless=true \
            -Dtest.session.cookie="${{ secrets.RAKSHALOKAM_SESSION_COOKIE }}"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            target/surefire-reports/
            test-output/
          retention-days: 7